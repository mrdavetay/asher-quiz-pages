    <figure class="question-figure">
      <pre class="question-figure-art" role="img" aria-label="${escapeHtml(question.figure_alt ?? "Question figure")}">${escapeHtml(question.figure)}</pre>
      ${caption}
    </figure>
  `;
}

function renderGeometryDiagram(question, requestedState, context = "support") {
  const diagram = question.geometry_diagram;
  if (!diagram) return "";

  const state = Math.max(0, Math.min(5, Number(requestedState) || 0));
  const stateId = `${diagram.state_prefix}${state}`;
  const svgId = `${stateId}-${context}`.replace(/[^a-zA-Z0-9_-]/g, "-");
  const labels = diagram.labels;
  const angles = diagram.derived_angles;
  const left = 78;
  const top = 38;
  const right = 442;
  const bottom = 402;
  const side = right - left;
  const lineAngle = angles.left_corner * Math.PI / 180;
  const intersectionOffset = side / (Math.tan(lineAngle) + 1);
  const e = { x: left + intersectionOffset, y: top + intersectionOffset };
  const g = { x: left + (bottom - 82) / Math.tan(lineAngle), y: 82 };
  const a = { x: left, y: top };
  const b = { x: right, y: top };
  const c = { x: right, y: bottom };
  const d = { x: left, y: bottom };
  const point = (value) => `${value.x.toFixed(1)},${value.y.toFixed(1)}`;
  const angleClass = state >= 5 ? "geometry-angle is-muted" : "geometry-angle is-current";
  const showDerivedLabels = state >= 4;
  const showFinalTargets = state >= 5;
  const title = `${stateId}: square angle-chain diagram`;
  const description = getGeometryStateDescription(question, state);

  const squareTicks = [
    geometryTickMarks(a, b, [0.5], 9),
    geometryTickMarks(b, c, [0.5], 9),
    geometryTickMarks(c, d, [0.5], 9),
    geometryTickMarks(d, a, [0.5], 9)
  ].join("");
  const givenTicks = [
    geometryTickMarks(b, c, [0.70, 0.74], 8),
    geometryTickMarks(g, c, [0.66, 0.70], 8)
  ].join("");
  const equalityMarkup = state >= 2 ? `
    <g class="geometry-current-fact">
      <path d="M ${d.x} ${d.y} L ${c.x} ${c.y} L ${b.x} ${b.y}" />
      <path d="M ${g.x.toFixed(1)} ${g.y} L ${c.x} ${c.y}" />
      <text x="188" y="390">${escapeHtml(`${labels.bottom_left}${labels.bottom_right} = ${labels.bottom_right}${labels.top_right}`)}</text>
      <text x="300" y="342">${escapeHtml(`${labels.apex}${labels.bottom_right} = ${labels.bottom_right}${labels.top_right}`)}</text>
    </g>
  ` : "";
  const triangleMarkup = state >= 3 ? `
    <g class="geometry-triangle-step">
      <polygon points="${point(g)} ${point(d)} ${point(c)}" />
      <polygon points="${point(g)} ${point(c)} ${point(b)}" />
      <text x="196" y="330">△${escapeHtml(`${labels.apex}${labels.bottom_left}${labels.bottom_right}`)}</text>
      <text x="354" y="176">△${escapeHtml(`${labels.apex}${labels.bottom_right}${labels.top_right}`)}</text>
      <text x="205" y="358">${escapeHtml(`${labels.bottom_left}${labels.bottom_right} = ${labels.bottom_right}${labels.apex}`)}</text>
    </g>
  ` : "";
  const derivedMarkup = showDerivedLabels ? `
    <g class="${angleClass}">
      <text x="91" y="344">${angles.triangle_corner}°</text>
      <text x="128" y="383">${angles.left_corner}°</text>
      <text x="${(g.x + 5).toFixed(1)}" y="${(g.y + 53).toFixed(1)}">${angles.left_apex}°</text>
      <text x="384" y="381">${angles.left_base}°</text>
      ${showFinalTargets ? "" : `<text x="414" y="329">${angles.target_a}°</text>`}
      <text x="405" y="98">${angles.right_base}°</text>
      <text x="${(g.x + 47).toFixed(1)}" y="${(g.y + 23).toFixed(1)}">${angles.right_apex}°</text>
      ${showFinalTargets ? "" : `<text x="365" y="59">${angles.target_b}°</text>`}
    </g>
  ` : "";
  const targetMarkup = showFinalTargets ? `
    <g class="geometry-final-target">
      <rect x="382" y="302" width="91" height="34" rx="8" />
      <text x="427.5" y="325" text-anchor="middle">(a) ${angles.target_a}°</text>
      <rect x="335" y="43" width="91" height="34" rx="8" />
      <text x="380.5" y="66" text-anchor="middle">(b) ${angles.target_b}°</text>
    </g>
  ` : "";

  return `
    <div class="geometry-diagram" data-geometry-state="${escapeHtml(stateId)}">
      <svg viewBox="0 0 520 450" role="img" aria-labelledby="${svgId}-title ${svgId}-desc">
        <title id="${svgId}-title">${escapeHtml(title)}</title>
        <desc id="${svgId}-desc">${escapeHtml(description)}</desc>
        <g class="geometry-base">
          <rect x="${left}" y="${top}" width="${side}" height="${side}" />
          <path d="M ${a.x} ${a.y} L ${c.x} ${c.y}" />
          <path d="M ${d.x} ${d.y} L ${g.x.toFixed(1)} ${g.y}" />
          <path d="M ${g.x.toFixed(1)} ${g.y} L ${c.x} ${c.y}" />
          <path d="M ${g.x.toFixed(1)} ${g.y} L ${b.x} ${b.y}" />
          ${state === 1 ? "" : `<path class="geometry-right-angle" d="M 78 57 L 97 57 L 97 38 M 423 38 L 423 57 L 442 57 M 442 383 L 423 383 L 423 402 M 97 402 L 97 383 L 78 383" />`}
          ${state === 1 ? "" : `<g class="geometry-equality-ticks">${squareTicks}${givenTicks}</g>`}
          <circle cx="${e.x.toFixed(1)}" cy="${e.y.toFixed(1)}" r="3.5" />
          <circle cx="${g.x.toFixed(1)}" cy="${g.y}" r="3.5" />
        </g>
        ${triangleMarkup}
        ${equalityMarkup}
        ${state === 1 ? "" : `<g class="geometry-given-angle">
          <path d="M ${(e.x - 19).toFixed(1)} ${(e.y - 18).toFixed(1)} Q ${(e.x - 42).toFixed(1)} ${e.y.toFixed(1)} ${(e.x - 18).toFixed(1)} ${(e.y + 23).toFixed(1)}" />
          <text x="${(e.x - 64).toFixed(1)}" y="${(e.y + 6).toFixed(1)}">${diagram.given_angle}°</text>
        </g>`}
        ${state >= 2 ? `<text class="${state >= 5 ? "geometry-angle is-muted" : "geometry-current-angle"}" x="101" y="83">${angles.diagonal_half}°</text>` : ""}
        ${derivedMarkup}
        ${targetMarkup}
        <g class="geometry-point-labels">
          <text x="58" y="32">${escapeHtml(labels.top_left)}</text>
          <text x="451" y="32">${escapeHtml(labels.top_right)}</text>
          <text x="451" y="424">${escapeHtml(labels.bottom_right)}</text>
          <text x="58" y="424">${escapeHtml(labels.bottom_left)}</text>
          <text x="${(e.x + 8).toFixed(1)}" y="${(e.y + 4).toFixed(1)}">${escapeHtml(labels.intersection)}</text>
          <text x="${(g.x - 5).toFixed(1)}" y="${(g.y - 12).toFixed(1)}">${escapeHtml(labels.apex)}</text>
        </g>
      </svg>
    </div>
  `;
}

function geometryTickMarks(start, end, fractions, halfLength) {
  const dx = end.x - start.x;
  const dy = end.y - start.y;
  const length = Math.hypot(dx, dy) || 1;
  const normalX = -dy / length * halfLength;
  const normalY = dx / length * halfLength;

  return fractions.map((fraction) => {
    const x = start.x + dx * fraction;
    const y = start.y + dy * fraction;
    return `<line x1="${(x - normalX).toFixed(1)}" y1="${(y - normalY).toFixed(1)}" x2="${(x + normalX).toFixed(1)}" y2="${(y + normalY).toFixed(1)}" />`;
  }).join("");
}

function getGeometryStateDescription(question, state) {
  const diagram = question.geometry_diagram;
  const labels = diagram.labels;
  const angles = diagram.derived_angles;
  const square = `${labels.top_left}${labels.top_right}${labels.bottom_right}${labels.bottom_left}`;
  const targetA = diagram.target_angle_names.a;
  const targetB = diagram.target_angle_names.b;

  if (state === 0) return `Clean source diagram for square ${square}, with the given ${diagram.given_angle}-degree angle, straight lines and equality marks. No derived angles are shown.`;
  if (state === 1) return `Fresh unannotated copy of the clean ${square} diagram for the drawing step.`;
  if (state === 2) return `The diagram now marks the 45-degree diagonal angle and the given side equalities.`;
  if (state === 3) return `The diagram now highlights both isosceles triangles and the inferred equal sides. No calculated angles are shown.`;
  if (state === 4) return `The diagram now shows the full calculated angle chain, including ${angles.target_a} degrees at ${targetA} and ${angles.target_b} degrees at ${targetB}.`;
  return `Completed diagram. Final targets are labelled part a, ${targetA} equals ${angles.target_a} degrees, and part b, ${targetB} equals ${angles.target_b} degrees. Intermediate angles are visually quieter.`;
}

function renderVisualStimulus(question) {
  const stimulus = question.visual_stimulus;
  if (!stimulus?.path) return "";

  const alt = stimulus.alt ?? "Question visual stimulus";
  const caption = stimulus.caption
    ? `<figcaption>${escapeHtml(stimulus.caption)}</figcaption>`
    : "";

  return `
    <figure class="visual-stimulus">
      <img src="${escapeHtml(stimulus.path)}" alt="${escapeHtml(alt)}" loading="lazy" />
      ${caption}
    </figure>
  `;
}

function renderPracticeMiniLesson(question) {
  const miniLesson = question.mini_lesson;
  if (!miniLesson) return "";

  const title = typeof miniLesson === "string" ? "Mini-lesson" : miniLesson.title ?? "Mini-lesson";
  const body = typeof miniLesson === "string" ? miniLesson : miniLesson.body;
  if (!body) return "";

  return `
    <section class="practice-mini-lesson">
      <h3>${escapeHtml(title)}</h3>
      ${formatTextBlock(body)}
    </section>
  `;
}

function renderPracticeThinkingBlocks(question) {
  const thinkingBlocks = question.thinking_blocks ?? [];
  const blockList = thinkingBlocks.map((block) => `
    <li>
      <strong>${escapeHtml(block.title)}</strong>
      <p>${escapeHtml(block.prompt)}</p>
    </li>
  `).join("");
  const blocksMarkup = blockList
    ? `
      <section class="thinking-section">
        <h3>Thinking Blocks</h3>
        <ol>${blockList}</ol>
      </section>
    `
    : "";
  const finalTargetMarkup = question.final_target_check
    ? `
      <section class="content-note final-target-check">
        <h3>Final Target Check</h3>
        ${formatTextBlock(question.final_target_check)}
      </section>
    `
    : "";

  return `${blocksMarkup}${finalTargetMarkup}`;
}

function renderUnlockedPracticeModel(question) {
  if (!question.model_clue) return "";

  return `
    <section class="content-note">
      <h3>Visual Model</h3>
      <pre class="model-clue">${escapeHtml(question.model_clue)}</pre>
      ${question.geometry_diagram ? renderGeometryDiagram(question, 1, "practice-model") : ""}
    </section>
  `;
}

function renderWorkedSolutionBlock(question, extraClass = "") {
  const geometry = question.geometry_diagram
    ? renderGeometryDiagram(question, 5, `${extraClass || "worked"}-diagram`)
    : "";
  const className = ["worked-solution-layout", extraClass, geometry ? "has-geometry" : ""]
    .filter(Boolean)
    .join(" ");

  return `
    <section class="${className}">
      ${geometry}
      <pre class="worked-solution" id="workedSolution">${escapeHtml(question.worked_solution)}</pre>
    </section>
  `;
}

function renderCheckpointInstruction(question) {
  if (!question.checkpoint_instruction) return "";

  return `
    <section class="checkpoint-instruction">
      ${formatTextBlock(question.checkpoint_instruction)}
    </section>
  `;
}

function renderCheckpointRecoverySupport(question, state) {
  if (!usesCheckpointRecoverySupport(question) || state.isCorrect) return "";

  if (!state.submitted) {
    return quiz.checkpoint_support_locked_label
      ? `<p class="small-note">${escapeHtml(quiz.checkpoint_support_locked_label)}</p>`
      : "";
  }

  const hints = question.hints.slice(0, state.hintsShown);
  const hintMarkup = hints.length
    ? `<ol class="hint-list">${hints.map((hint, index) => `
        <li>
          ${formatTextBlock(hint)}
          ${question.geometry_diagram ? renderGeometryDiagram(question, index + 1, `checkpoint-hint-${index + 1}`) : ""}
        </li>
      `).join("")}</ol>`
    : "";
  const allHintsShown = state.hintsShown >= question.hints.length;
  const supportNote = allHintsShown && !state.solutionShown
    ? quiz.checkpoint_retry_after_hints_label
    : "";

  return `
    <section class="checkpoint-recovery-support">
      <div class="support-actions">
        <button type="button" class="secondary-action" id="checkpointHintButton"
          ${allHintsShown || state.solutionShown ? "disabled" : ""}>Hint</button>
      </div>
      ${supportNote ? `<p class="small-note">${escapeHtml(supportNote)}</p>` : ""}
      ${hintMarkup}
    </section>
  `;
}

function renderWorkingConfirmation(question) {
  return `
    <div class="checkpoint-gate">
      <button type="button" class="primary-action" id="workingDoneButton">
        ${escapeHtml(question.working_confirmation_label ?? "I have finished my working")}
      </button>
    </div>
  `;
}

function renderAuditInstructions() {
  return `
    <section class="audit-instruction">
      <h3>Asher — how to answer these review questions</h3>
      <p>Asher, answer these quick review questions honestly before typing your final answer. They are not trick questions and are not part of your score.</p>
      <p>Mate, choose what you actually used in your foolscap working. If you are unsure, choose "Other / not sure". This helps Dad see how you thought, not only whether the final answer was correct.</p>
    </section>
  `;
}

function renderAuditFields(question, state) {
  const fields = question.audit_fields ?? [];
  if (!fields.length) return "";

  const fieldMarkup = fields.map((field) => {
    const value = state.auditResponses[field.field_id] ?? "";
    const label = escapeHtml(field.label);

    if (field.type === "textarea") {
      return `
        <label class="audit-field">
          <span>${label}</span>
          <textarea data-audit-field="${escapeHtml(field.field_id)}" rows="3">${escapeHtml(value)}</textarea>
        </label>
      `;
    }

    const options = (field.options ?? []).map(
      (option) => `<option value="${escapeHtml(option)}">${escapeHtml(option)}</option>`
    ).join("");

    return `
      <label class="audit-field">
        <span>${label}</span>
        <select data-audit-field="${escapeHtml(field.field_id)}">
          <option value="">Choose one</option>
          ${options}
        </select>
      </label>
    `;
  }).join("");

  return `
    <section class="audit-section">
      ${renderAuditInstructions()}
      <h3>Mate — quick review</h3>
      ${fieldMarkup}
    </section>
  `;
}

function renderAnswerForm(question, disabled) {
  const disabledAttribute = disabled ? "disabled" : "";

  if (isMultiPartQuestion(question)) {
    const fields = question.answer_parts.map((part) => `
      <label class="answer-part-field" for="answerInput-${escapeHtml(part.part_id)}">
        <span>${escapeHtml(part.label)}</span>
        <input id="answerInput-${escapeHtml(part.part_id)}" data-answer-input data-answer-part="${escapeHtml(part.part_id)}" name="answer-${escapeHtml(part.part_id)}" autocomplete="off" ${disabledAttribute} />
      </label>
    `).join("");

    return `
      <form class="answer-form multi-part-answer-form" id="answerForm">
        ${fields}
        <button type="submit" class="primary-action" id="submitButton" ${disabledAttribute}>Submit Answer</button>
      </form>
    `;
  }

  if (isMcqOptionsQuestion(question)) {
    return `
      <form class="answer-form mcq-answer-form" id="answerForm">
        <fieldset class="mcq-fieldset">
          <legend>${escapeHtml(question.answer_label ?? "Choose one answer")}</legend>
          <div class="mcq-option-grid">
            ${renderMcqOptions(question, disabledAttribute)}
          </div>
        </fieldset>
        <button type="submit" class="primary-action" id="submitButton" ${disabledAttribute}>Submit Answer</button>
      </form>
    `;
  }

  return `
    <form class="answer-form" id="answerForm">
      <label for="answerInput">${escapeHtml(question.answer_label ?? "Answer")}</label>
      <input id="answerInput" data-answer-input name="answer" autocomplete="off" ${disabledAttribute} />
      <button type="submit" class="primary-action" id="submitButton" ${disabledAttribute}>Submit Answer</button>
    </form>
  `;
}

function renderMcqOptions(question, disabledAttribute) {
  return question.options.map((option) => {
    const optionKey = escapeHtml(option.key);
    const optionLabel = escapeHtml(option.label ?? option.key);
    const optionText = escapeHtml(option.text ?? "");
    const sourceOptionNumber = Number.isInteger(option.source_option_number)
      ? ` data-source-option-number="${option.source_option_number}"`
      : "";

    return `
      <label class="mcq-option">
        <input type="radio" data-answer-input data-answer-option="${optionKey}" name="answer" value="${optionKey}" ${disabledAttribute}${sourceOptionNumber} />
        <span class="mcq-option-label">${optionLabel}</span>
        <span class="mcq-option-text">${optionText}</span>
      </label>
    `;
  }).join("");
}

function bindAnswerInputs(question, state) {
  if (isMultiPartQuestion(question)) {
    question.answer_parts.forEach((part) => {
      const input = document.querySelector(`[data-answer-part="${cssEscape(part.part_id)}"]`);
      input.value = state.input[part.part_id] ?? "";
      input.addEventListener("input", () => {
        state.input = {
          ...state.input,
          [part.part_id]: input.value
        };
      });
    });
    return;
  }

  if (isMcqOptionsQuestion(question)) {
    question.options.forEach((option) => {
      const input = document.querySelector(`[data-answer-option="${cssEscape(option.key)}"]`);
      if (!input) return;

      input.checked = state.input === option.key;
      input.addEventListener("change", () => {
        state.input = input.value;
      });
    });
    return;
  }

  const input = document.querySelector("#answerInput");
  input.value = state.input;
  input.addEventListener("input", () => {
    state.input = input.value;
  });
}

function bindAuditInputs(question, state) {
  (question.audit_fields ?? []).forEach((field) => {
    const input = document.querySelector(`[data-audit-field="${cssEscape(field.field_id)}"]`);
    if (!input) return;

    input.value = state.auditResponses[field.field_id] ?? "";
    input.addEventListener("input", () => {
      state.auditResponses = {
        ...state.auditResponses,
        [field.field_id]: input.value
      };
    });
  });
}

function getAnswerInputValue(question) {
  if (isMultiPartQuestion(question)) {
    return Object.fromEntries(
      question.answer_parts.map((part) => {
        const input = document.querySelector(`[data-answer-part="${cssEscape(part.part_id)}"]`);
        return [part.part_id, input?.value ?? ""];
      })
    );
  }

  if (isMcqOptionsQuestion(question)) {
    return document.querySelector("[data-answer-option]:checked")?.value ?? "";
  }

  return document.querySelector("#answerInput")?.value ?? "";
}

function focusFirstAnswerInput() {
  document.querySelector("[data-answer-input]")?.focus();
}

function getInitialInputState(question) {
  if (!isMultiPartQuestion(question)) return "";

  return Object.fromEntries((question.answer_parts ?? []).map((part) => [part.part_id, ""]));
}

function isMultiPartQuestion(question) {
  return question.expected_format === "multi_part" && Array.isArray(question.answer_parts);
}

function isMcqOptionsQuestion(question) {
  return question.expected_format === "mcq" && Array.isArray(question.options) && question.options.length > 0;
}

function usesWorkingConfirmation(question) {
  return Boolean(question.requires_working_confirmation || question.audit_fields?.length);
}

function isPracticeSolutionLocked(question, state) {
  if (question.requires_attempt_before_support && !state.submitted) return true;
  return quiz.practice_solution_policy === "after_correct" && !state.isCorrect;
}

function usesCheckpointRecoverySupport(question) {
  return quiz.checkpoint_support_policy === "after_wrong_all_hints_then_wrong"
    && Array.isArray(question.hints)
    && question.hints.length > 0
    && Boolean(question.worked_solution);
}

function usesPrivacySafePracticeLogging() {
  return quiz.practice_logging === "privacy_safe";
}

function recordPracticeEvent(eventType, details = {}) {
  if (!privacySafePracticeSession) return null;
  return recordPrivacySafePracticeEvent(privacySafePracticeSession, eventType, details);
}

function recordCheckpointAction(eventType, details = {}) {
  if (!checkpointSession || quiz.action_logging !== "all_local") return null;
  return recordCheckpointEvent(checkpointSession, eventType, details);
}

function formatTextBlock(value) {
  return escapeHtml(value)
    .split(/\n{2,}/)
    .map((paragraph) => `<p>${paragraph.replace(/\n/g, "<br>")}</p>`)
    .join("");
}

function cssEscape(value) {
  return String(value).replace(/\\/g, "\\\\").replace(/"/g, "\\\"");
}

function renderInstructionCallout() {
  if (!quizHasCalculatorPolicy()) return "";

  return `
    <div class="instruction-callout">
      <p><strong><u>Check the calculator instruction for every question.</u></strong></p>
      <p>If it says <strong><u>Calculator: Not allowed</u></strong>, do it without a calculator and write your working on foolscap paper.</p>
      <p>If it says <strong><u>Calculator: Allowed</u></strong>, you may use a calculator, but only after choosing the correct steps.</p>
      <p>The calculator can help with arithmetic. It cannot read the story. No licence, no driving.</p>
    </div>
  `;
}

function quizHasCalculatorPolicy() {
  return [...(quiz.practice_questions ?? []), ...(quiz.checkpoint_questions ?? [])].some(
    (question) => question.calculator_policy
  );
}

function bindQuestionMap(renderFunction) {
  document.querySelectorAll(".question-map-button").forEach((button) => {
    button.addEventListener("click", () => {
      const nextIndex = Number(button.dataset.questionIndex);
      const questions = activeMode === "Practice" ? quiz.practice_questions : quiz.checkpoint_questions;
      const details = {
        from_question_id: questions[currentIndex]?.question_id ?? "",
        to_question_id: questions[nextIndex]?.question_id ?? "",
        direction: "map"
      };
      if (activeMode === "Practice") recordPracticeEvent("question_navigation", details);
      if (activeMode === "Checkpoint") recordCheckpointAction("question_navigation", details);
      currentIndex = nextIndex;
      renderFunction();
    });
  });
}

function getMapStatus(state, isCurrent) {
  if (isCurrent) return { label: "Current", className: "current" };
  if (!state.submitted) return { label: "Not tried", className: "not-tried" };
  if (state.isCorrect) return { label: "Correct", className: "correct" };
  return { label: "Tried", className: "tried" };
}

function escapeHtml(value) {
  const replacements = {
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    "\"": "&quot;",
    "'": "&#039;"
  };

  return String(value).replace(/[&<>"']/g, (character) => replacements[character]);
}

function renderFeedback(state, mode) {
  const feedback = document.querySelector("#feedback");
  const status = mode === "Practice" ? document.querySelector("#practiceStatus") : null;

  if (!state.submitted) {
    feedback.textContent = "";
    if (status) status.textContent = "Not submitted yet.";
    return;
  }

  feedback.textContent = state.feedbackMessage;
  feedback.className = state.isCorrect ? "feedback is-correct" : "feedback is-retry";
  if (status) status.textContent = state.isCorrect ? "Latest answer: correct." : "Latest answer: try again.";
}

function getAttemptCount(questionId) {
  return checkpointSession.attempts.filter((attempt) => attempt.question_id === questionId).length;
}

function getLatestAttempt(questionId) {
  const attempts = checkpointSession.attempts.filter((attempt) => attempt.question_id === questionId);
  return attempts.length ? attempts[attempts.length - 1] : null;
}

function getSummaryStatus(latestAttempt) {
  if (!latestAttempt || latestAttempt.feedback_code === "BLANK") return "Blank";
  return latestAttempt.is_correct ? "Correct" : "Incorrect";
}

function renderLoadError(error) {
  app.innerHTML = `
    <section class="panel error-panel">
      <p class="eyebrow">Local setup needed</p>
      <h1>Quiz content did not load.</h1>
      <p class="lede">Run a local server from the repo root, then open the local URL.</p>
      <pre class="run-command">python -m http.server 8000</pre>
      <p class="small-note">Then open http://localhost:8000/</p>
    </section>
  `;

  console.error(error);
}

    </script>
  </body>
</html>
